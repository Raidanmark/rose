name: Deploy Main

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/raidanmark/rose:dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME"

      - name: Deploy dev on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eux

            cd /opt/rose-dev

            echo "=== COMPOSE CONFIG ==="
            docker compose config

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

            echo "=== PULL ==="
            docker compose pull

            echo "=== RECREATE ==="
            docker compose down
            docker compose up -d --force-recreate

            echo "=== STATUS ==="
            docker compose ps

            echo "=== IMAGES ==="
            docker compose images

            echo "=== WAIT FOR APP ==="
            APP_READY=false

            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -sS \
                --max-time 3 \
                -o /dev/null \
                -w "%{http_code}" \
                http://localhost:8081/swagger-ui/index.html \
                || true)

              if [ "$HTTP_CODE" != "000" ]; then
                echo "Application is responding with HTTP $HTTP_CODE"
                APP_READY=true
                break
              fi

              echo "Waiting for application... attempt $i/30"
              sleep 2
            done

            if [ "$APP_READY" != "true" ]; then
              echo "Application did not start in time"
              docker compose logs --tail=300
              exit 1
            fi

            echo "=== REGISTER TEST ==="
            curl -i \
              --max-time 20 \
              -X POST http://localhost:8081/auth/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"deploy-test-${{ github.run_id }}\",\"email\":\"deploy-${{ github.run_id }}@example.com\",\"password\":\"password123\"}" \
              || true

            echo "=== LOGS AFTER REQUEST ==="
            docker compose logs --tail=300
